                    <div style="border:1px solid var(--border);border-radius:8px;padding:8px">
                      <div style="font-weight:600;font-size:0.7rem">${esc(i.name)}</div>
                      <input type="number" id="intrec_${i.id}" placeholder="Qty" min="0" value="0" style="margin-top:4px;padding:4px 6px;font-size:0.8rem" oninput="updateInternalReceiptTotal()">
                    </div>
                  `).join('')}
                </div>
                <div id="intRecTotalItems" style="background:rgba(30,110,240,0.06);padding:6px 12px;border-radius:8px;margin:8px 0;text-align:right;font-weight:700">Total Items: 0</div>
                <button class="btn btn-primary" onclick="submitInternalReceipt()">✅ Submit Receipt</button>
                <button class="btn btn-ghost btn-sm" onclick="document.getElementById('internalReceiptForm').style.display='none'">✕ Cancel</button>
              </div>
              ` : ''}
            </div>
            <div class="card">
              <h3>📊 Internal Stock Summary</h3>
              ${items.length ? `
              <div class="table-wrap"><table style="min-width:700px">
                <thead><tr><th class="tl">Item</th><th>Opening</th><th>Received</th><th>Issued</th><th>Closing</th></tr></thead>
                <tbody>
                  ${items.map(i=>{
                    const op = st[i.id+'_opening']||0;
                    const rec = st[i.id+'_received']||0;
                    const dist = st[i.id+'_distributed']||0;
                    const cl = st[i.id+'_closing']||0;
                    return `<tr><td class="tl">${esc(i.name)}</td><td>${op}</td><td>${rec}</td><td>${dist}</td><td><strong>${cl}</strong></td></tr>`;
                  }).join('')}
                </tbody>
              </table></div>
              ` : `<div style="padding:12px;color:var(--muted);text-align:center">No Internal items defined.</div>`}
            </div>
            <div class="card">
              <h3>📜 Internal Stock Movement History (Invoice-based)</h3>
              <div class="table-wrap"><table style="min-width:750px">
                <thead><tr><th>Invoice #</th><th>Date</th><th>Type</th><th>Recipient</th><th>Items</th><th>Total Qty</th><th>Action</th></tr></thead>
                <tbody>
                  ${(st.movements||[]).slice().reverse().map((mv, idx) => {
                    const realIdx = st.movements.length - 1 - idx;
                    return `<tr>
                      <td><strong>${esc(mv.invoice||'—')}</strong></td>
                      <td>${fmtDateShort(mv.date)}</td>
                      <td><span class="movement-type ${mv.type||'receipt'}">${mv.type==='management'?'📤 Issued':'📥 Received'}</span></td>
                      <td>${esc(mv.recipient||'—')}</td>
                      <td>${mv.items.map(it => `${items.find(x=>x.id===it.id)?.name||it.id} x${it.qty}`).join(', ')}</td>
                      <td>${mv.totalItems||0}</td>
                      <td>
                        <button class="btn btn-danger btn-xs" onclick="deleteInternalStockMovement('${m}', ${realIdx})" title="Delete and reverse stock">🗑️</button>
                      </td>
                    </tr>`;
                  }).join('') || `<tr><td colspan="7" style="color:var(--muted)">No movements recorded.</td></tr>`}
                </tbody>
              </table></div>
            </div>
          `;
            $('mainContent').innerHTML = html;
            window.changeIntStockM = v => { STATE.month = v;
                renderInternalStockManagement(); };
            window.updateInternalReceiptTotal = function() {
                const items = getInternalItems();
                let total = 0;
                items.forEach(i => {
                    const qty = parseInt($('intrec_' + i.id)?.value) || 0;
                    total += qty;
                });
                const el = $('intRecTotalItems');
                if (el) el.innerText = 'Total Items: ' + total;
            };
        }

        window.recordInternalReceipt = function() {
            const form = $('internalReceiptForm');
            if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
        };

        // ═══════════════════════════════════════════════════════════════
        // FIXED: submitInternalReceipt - Now properly saves data
        // ═══════════════════════════════════════════════════════════════
        window.submitInternalReceipt = function() {
            const items = getInternalItems();
            const m = STATE.month;
            const invoice = $('intRecInvoice')?.value.trim();
            const dateStr = $('intRecDate')?.value;
            
            if (!invoice) { toast('Enter invoice number', 'warn'); return; }
            if (!dateStr) { toast('Select a date', 'warn'); return; }

            const receivedItems = items.map(i => {
                const qty = parseInt($('intrec_' + i.id)?.value) || 0;
                return { id: i.id, qty };
            });
            
            const totalQty = receivedItems.reduce((sum, it) => sum + it.qty, 0);
            if (totalQty === 0) { toast('Enter at least one quantity', 'warn'); return; }

            if (!STATE.internalStock[m]) STATE.internalStock[m] = blankInternalStock();
            const st = STATE.internalStock[m];
            
            // Update stock quantities
            receivedItems.forEach(it => {
                st[it.id + '_received'] = (st[it.id + '_received'] || 0) + it.qty;
                st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                    it.id + '_distributed'] || 0);
            });

            if (!st.movements) st.movements = [];
            st.movements.push({
                id: 'intmv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type: 'receipt',
                invoice: invoice,
                date: dateStr,
                items: receivedItems.filter(it => it.qty > 0),
                totalItems: totalQty,
                recipient: 'Internal Receipt',
                createdAt: new Date().toISOString()
            });
            
            toast(`✅ Internal receipt recorded (${totalQty} items, Invoice: ${invoice})`);
            
            // Clear the form
            $('internalReceiptForm').style.display = 'none';
            items.forEach(i => { const el = $('intrec_' + i.id); if (el) el.value = '0'; });
            $('intRecInvoice').value = '';
            
            // ✅ CRITICAL FIX: Save and then refresh
            schedulePersist();
            // Wait for save to complete before refreshing
            setTimeout(() => renderInternalStockManagement(), 500);
        };

        window.deleteInternalStockMovement = function(month, idx) {
            if (!confirm('Delete this movement record? This will REVERSE the stock quantities.')) return;
            const st = STATE.internalStock[month];
            if (!st || !st.movements || !st.movements[idx]) { toast('Record not found', 'err'); return; }
            
            const mv = st.movements[idx];
            if (mv.type === 'receipt') {
                mv.items.forEach(it => {
                    st[it.id + '_received'] = Math.max(0, (st[it.id + '_received'] || 0) - it.qty);
                    st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                        it.id + '_distributed'] || 0);
                });
            } else if (mv.type === 'management') {
                mv.items.forEach(it => {
                    st[it.id + '_distributed'] = Math.max(0, (st[it.id + '_distributed'] || 0) - it.qty);
                    st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                        it.id + '_distributed'] || 0);
                });
            } else {
                mv.items.forEach(it => {
                    st[it.id + '_received'] = Math.max(0, (st[it.id + '_received'] || 0) - it.qty);
                    st[it.id + '_distributed'] = Math.max(0, (st[it.id + '_distributed'] || 0) - it.qty);
                    st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                        it.id + '_distributed'] || 0);
                });
            }
            
            st.movements.splice(idx, 1);
            recalcInternalStockFromMovements();
            
            toast('🗑️ Movement deleted and stock reversed');
            schedulePersist();
            setTimeout(() => renderInternalStockManagement(), 300);
        };

        // ═══════════════════════════════════════════════════════════════
        // EXPORT CSV
        // ═══════════════════════════════════════════════════════════════

        window.exportCSV = function() {
            const items = getPostshopItems();
            const m = STATE.month,
                vis = visibleBranches();
            const headers = ['Branch', 'District', ...items.flatMap(i => [i.name + ' Qty', i.name + ' Value']),
                'Total Value', 'Payments', 'Closing'
            ];
            const rows = [headers];
            vis.forEach(b => {
                const r = STATE.ledger[m]?.[b.id] || blankLedger();
                const row = [b.name, b.district];
                items.forEach(i => {
                    row.push(r[i.id + '_qty'] || 0);
                    row.push(r[i.id + '_value'] || 0);
                });
                row.push(r.totalValue || 0);
                row.push(r.payments || 0);
                row.push(r.closingBalance || 0);
                rows.push(row);
            });
            const csv = rows.map(r => r.join(',')).join('\n');
            const a = document.createElement('a');
            a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            a.download = `Stationery_Supply_${m.replace(/ /g,'_')}.csv`;
            a.click();
            toast('CSV exported');
        };

        // ═══════════════════════════════════════════════════════════════
        // LOGIN / LOGOUT
        // ═══════════════════════════════════════════════════════════════

        async function doLogin() {
            const role = $('loginRole').value;
            if (!role) { toast('Select a role', 'warn'); return; }

            let district = null,
                branchId = null;
            if (role === 'District Head') {
                const ds = $('distSel');
                if (!ds || !ds.value) { toast('Select district', 'warn'); return; }
                district = ds.value;
            } else if (role === 'Post Master') {
                const bs = $('branchSel');
                if (!bs || !bs.value) { toast('Select branch', 'warn'); return; }
                branchId = bs.value;
            }

            const pin = $('loginPw').value.trim();

            if (pin !== '1234') {
                toast('❌ Invalid PIN. Use 1234 for all roles.', 'err');
                return;
            }

            const ov = $('loading-overlay');
            ov.classList.remove('hidden');
            $('login-view').style.display = 'none';
            _setLoadStep(0, 'Verifying credentials …');

            STATE.user = { role, district, branchId };
            const roleDisplay = role === 'Regional Head' ? '🌟 Regional Head' :
                role === 'Accountant' ? '💰 Accountant' : role;
            $('uRole').innerText = roleDisplay;
            $('uLoc').innerText = role === 'Post Master' ? BRANCHES.find(b => b.id === branchId)?.name || '' :
                role === 'District Head' ? district : 'Full Region Access';
            const tag = $('uFooterTag');
            if (tag) tag.innerText = '✨ ' + roleDisplay + ' · Accra West';

            setTimeout(() => {
                _setLoadStep(1, 'Loading latest data …');
                pullState(true, true);
                setTimeout(() => {
                    _setLoadStep(2, 'Building dashboard …');
                    setTimeout(() => {
                        _setLoadStep(3, 'Ready!');
                        setTimeout(() => {
                            ov.classList.add('hidden');
                            $('app-view').classList.remove('hidden');
                            buildNav();
                            if (_pollTimer) clearInterval(_pollTimer);
                            _pollTimer = setInterval(() => pullState(true), 20000);
                        }, 250);
                    }, 250);
                }, 250);
            }, 250);
        }

        function _setLoadStep(idx, msg) {
            const sub = $('loadSub');
            if (sub) sub.innerText = msg;
            for (let i = 0; i < 4; i++) {
                const el = $('ls' + i);
                if (!el) continue;
                if (i < idx) { el.className = 'loader-step done'; } else if (i === idx) { el.className =
                        'loader-step active'; } else { el.className = 'loader-step'; }
            }
        }

        function logout() {
            if (!confirm('Exit session?')) return;
            if (_pollTimer) clearInterval(_pollTimer);
            STATE.user = { role: null, district: null, branchId: null };
            $('app-view').classList.add('hidden');
            $('login-view').style.display = 'flex';
            $('loginRole').value = '';
            $('loginPw').value = '';
            const rf = $('roleField');
            if (rf) rf.innerHTML = '';
        }

        function toggleDrawer() {
            $('mainSidebar').classList.toggle('open');
            $('sidebarOverlay').classList.toggle('active');
        }

        function closeDrawer() {
            $('mainSidebar').classList.remove('open');
            $('sidebarOverlay').classList.remove('active');
        }

        // ─── BOOT ────────────────────────────────────────────────────────

        $('loginRole').addEventListener('change', function() {
            const rf = $('roleField');
            if (this.value === 'District Head') {
                rf.innerHTML =
                    `<label>District</label><select id="distSel">${DISTRICTS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select>`;
            } else if (this.value === 'Post Master') {
                rf.innerHTML =
                    `<label>Branch</label><select id="branchSel">${BRANCHES.map(b=>`<option value="${b.id}">${b.name} (${b.district})</option>`).join('')}</select>`;
            } else {
                rf.innerHTML = '';
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && $('login-view').style.display !== 'none') doLogin();
        });

        async function bootFromServer() {
            _setLoadStep(0, 'Connecting to server …');
            try {
                const response = await fetch(API_URL + '?action=loadState');
                const json = await response.text();
                if (json) {
                    try {
                        const loaded = JSON.parse(json);
                        if (loaded && Object.keys(loaded).length) {
                            SHARED_KEYS.forEach(k => { STATE[k] = loaded[k] !== undefined ? loaded[k] :
                                    (k === 'ledger' || k === 'stock' || k === 'itemPrices' || k === 'monthlyReports' ||
                                        k === 'internalStock' ? {} : []);
                            });
                            if (!STATE.postshopItems) STATE.postshopItems = [];
                            if (!STATE.internalItems) STATE.internalItems = [];
                            if (!STATE.internalStock) STATE.internalStock = {};
                            if (!STATE.internalMovements) STATE.internalMovements = [];
                            ensureStockStructure();
                            recalcAll();
                            console.log('✅ Boot: Data loaded from server');
                        } else {
                            seedData();
                            persistState(false);
                        }
                    } catch (e) {
                        console.log('⚠️ Boot: Could not parse server data, seeding...', e.message);
                        seedData();
                    }
                } else {
                    console.log('⚠️ Boot: Empty response, seeding...');
                    seedData();
                }
            } catch (err) {
                console.log('⚠️ Boot: Could not reach server, seeding...', err.message);
                seedData();
                toast('⚠️ Could not reach the server — showing demo data', 'warn');
            }
            $('loading-overlay').classList.add('hidden');
        }

        bootFromServer();

        console.log('📦 Stationery Hub — Accra West');
        console.log('✅ API URL: ' + API_URL);
        console.log('🔑 PIN: 1234 for all roles');
        console.log('✅ All bugs fixed — data now properly saves to Google Sheets');
        console.log('✅ Internal stock receipt bug fixed');
        console.log('✅ Added 300ms delay after saves before refresh');
        console.log('✅ schedulePersist() now called before render refresh');
    </script>
</body>
</html>
