<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>📦 Stationery Stock & Supply – Accra West</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        :root {
            --bg: #0a2540;
            --bg2: #1a3f7a;
            --card: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.15);
            --text: #f0f4ff;
            --muted: #b0c8f0;
            --blue: #1e6ef0;
            --blue2: #0a4bb5;
            --cyan: #22d3ee;
            --purple: #a78bfa;
            --pink: #f472b6;
            --orange: #f59e0b;
            --green: #34d399;
            --red: #f87171;
            --white: #ffffff;
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            --sidebar-w: 260px;
        }
        html {
            font-size: 15px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--orange);
            border-radius: 10px;
        }
        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-3 {
            gap: 12px;
        }
        .gap-4 {
            gap: 16px;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--muted);
        }
        .text-sm {
            font-size: 0.78rem;
        }
        .text-xs {
            font-size: 0.68rem;
        }
        .font-bold {
            font-weight: 700;
        }
        .font-mono {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        .btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            backdrop-filter: blur(6px);
            letter-spacing: 0.02em;
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.15);
            box-shadow: 0 8px 28px rgba(30, 110, 240, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            color: #fff;
            border: none;
        }
        .btn-success {
            background: linear-gradient(135deg, var(--green), #0d9488);
            color: #fff;
            border: none;
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--red), #dc2626);
            color: #fff;
            border: none;
        }
        .btn-orange {
            background: linear-gradient(135deg, var(--orange), #d97706);
            color: #fff;
            border: none;
        }
        .btn-purple {
            background: linear-gradient(135deg, var(--purple), #6d28d9);
            color: #fff;
            border: none;
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 0.7rem;
        }
        .btn-xs {
            padding: 3px 10px;
            font-size: 0.62rem;
        }
        .btn-glow {
            animation: glowPulse 2s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(30, 110, 240, 0.15);
            }
            50% {
                box-shadow: 0 0 24px rgba(30, 110, 240, 0.4);
            }
        }

        input,
        select,
        textarea {
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 0.85rem;
            width: 100%;
            transition: var(--transition);
            outline: none;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
        }
        input::placeholder,
        textarea::placeholder {
            color: var(--muted);
            opacity: 0.5;
        }
        label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            display: block;
            margin-bottom: 4px;
        }

        select option {
            background: #1a3f7a;
            color: #f0f4ff;
            padding: 6px 10px;
        }
        select option:hover,
        select option:focus,
        select option:checked {
            background: #f59e0b;
            color: #0b2b5c;
        }
        select {
            appearance: auto;
            -webkit-appearance: auto;
            background-color: rgba(255, 255, 255, 0.06);
            color: #f0f4ff;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .card:hover {
            border-color: rgba(245, 158, 11, 0.25);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            animation: floatOrb 22s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--blue);
            top: -15%;
            left: -10%;
        }
        .orb-2 {
            width: 450px;
            height: 450px;
            background: var(--orange);
            bottom: -10%;
            right: -8%;
            animation-delay: 7s;
        }
        .orb-3 {
            width: 350px;
            height: 350px;
            background: var(--white);
            top: 50%;
            left: 55%;
            animation-delay: 14s;
            opacity: 0.05;
        }
        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(50px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 30px) scale(0.9);
            }
            100% {
                transform: translate(40px, -20px) scale(1.05);
            }
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #0b2b5c 0%, #1a3f7a 60%, #f59e0b 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.6s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-box {
            position: relative;
            width: 100px;
            height: 100px;
        }
        .loader-box svg {
            width: 100%;
            height: 100%;
            animation: loaderBounce 1.2s ease-in-out infinite;
        }
        @keyframes loaderBounce {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-12px) scale(1.04);
            }
        }
        .loader-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--orange);
            border-right-color: var(--white);
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loader-text {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #f0f4ff, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .loader-sub {
            font-size: 0.8rem;
            color: var(--muted);
            min-height: 1.4em;
            transition: opacity 0.3s;
        }
        .loader-steps {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .loader-step {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
            transition: 0.4s;
        }
        .loader-step.active {
            background: var(--orange);
            transform: scale(1.4);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.5);
        }
        .loader-step.done {
            background: var(--white);
        }

        #login-view {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #1a3f7a, #0b2b5c 70%);
            position: relative;
            z-index: 1;
        }
        #login-view .login-card {
            background: rgba(11, 43, 92, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 36px;
            max-width: 440px;
            width: 92%;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .login-title {
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #f0f4ff, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-sub {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        #app-view {
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: rgba(11, 43, 92, 0.92);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 100;
            position: relative;
        }
        .sidebar-brand {
            padding: 20px 16px 14px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .sidebar-brand .brand-icon {
            font-size: 2.4rem;
        }
        .sidebar-brand h2 {
            font-size: 1.05rem;
            font-weight: 800;
            margin-top: 2px;
            background: linear-gradient(135deg, #f0f4ff, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sidebar-brand .brand-sub {
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.06em;
        }
        .sidebar-user {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-user .role {
            font-weight: 700;
            font-size: 0.85rem;
            color: #f59e0b;
        }
        .sidebar-user .loc {
            font-size: 0.7rem;
            color: var(--muted);
        }
        .sidebar-user .status {
            font-size: 0.6rem;
            color: var(--muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--orange);
            display: inline-block;
            animation: dotPulse 1.8s ease-in-out infinite;
        }
        .status-dot.live {
            background: var(--green);
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .sidebar-nav {
            padding: 10px 8px;
            flex: 1;
            overflow-y: auto;
        }
        .nav-section {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            padding: 8px 10px 4px;
            opacity: 0.4;
        }
        .nav-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--muted);
            padding: 9px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2px;
            position: relative;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
        }
        .nav-btn.active {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .nav-btn .badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--red);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 20px;
            min-width: 18px;
            text-align: center;
        }
        .sidebar-footer {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
        }
        .sidebar-footer .btn {
            width: 100%;
            justify-content: center;
        }
        .sidebar-footer .tiny {
            font-size: 0.55rem;
            color: var(--muted);
            text-align: center;
            margin-top: 6px;
            opacity: 0.3;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 22px 28px;
            background: transparent;
            position: relative;
            z-index: 1;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f0f4ff, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .month-badge {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 5px 18px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #f59e0b;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: var(--card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .kpi-card:hover {
            transform: translateY(-4px);
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 8px 36px rgba(0, 0, 0, 0.3);
        }
        .kpi-card .kpi-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            font-weight: 600;
        }
        .kpi-card .kpi-val {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 4px 0 2px;
            letter-spacing: -0.02em;
        }
        .kpi-card .kpi-sub {
            font-size: 0.7rem;
            color: var(--muted);
        }
        .kpi-card .kpi-icon {
            font-size: 1.6rem;
            opacity: 0.2;
            position: absolute;
            right: 12px;
            top: 12px;
        }
        .kpi-card.glow-blue .kpi-val {
            color: var(--blue);
        }
        .kpi-card.glow-green .kpi-val {
            color: var(--green);
        }
        .kpi-card.glow-orange .kpi-val {
            color: var(--orange);
        }
        .kpi-card.glow-purple .kpi-val {
            color: var(--purple);
        }
        .kpi-card.glow-pink .kpi-val {
            color: var(--pink);
        }
        .kpi-card.glow-cyan .kpi-val {
            color: var(--cyan);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .chart-box {
            background: var(--card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
        }
        .chart-box .chart-title {
            font-weight: 700;
            font-size: 0.82rem;
            margin-bottom: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            min-width: 720px;
        }
        th,
        td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            text-align: center;
            white-space: nowrap;
        }
        th {
            background: rgba(255, 255, 255, 0.04);
            color: #f59e0b;
            font-weight: 700;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .tl {
            text-align: left;
            font-weight: 600;
        }
        .pos {
            color: var(--green);
        }
        .neg {
            color: var(--red);
        }
        .tot-row {
            background: rgba(30, 110, 240, 0.08);
            font-weight: 700;
        }
        .gtot-row {
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            color: #fff;
            font-weight: 700;
        }
        .gtot-row td {
            color: #fff !important;
        }
        .dist-hdr {
            background: linear-gradient(90deg, rgba(30, 110, 240, 0.12), rgba(245, 158, 11, 0.12));
            padding: 8px 14px;
            border-radius: 10px 10px 0 0;
            font-weight: 700;
            font-size: 0.78rem;
            margin-top: 14px;
            border: 1px solid var(--border);
            border-bottom: none;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
        }
        .toast {
            background: rgba(11, 43, 92, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-left: 4px solid var(--green);
            border-radius: 14px;
            padding: 14px 20px;
            color: var(--text);
            font-weight: 600;
            font-size: 0.82rem;
            box-shadow: 0 8px 36px rgba(0, 0, 0, 0.4);
            animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .toast.err {
            border-left-color: var(--red);
        }
        .toast.warn {
            border-left-color: var(--orange);
        }
        @keyframes toastIn {
            from {
                transform: translateX(110%) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: rgba(11, 43, 92, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            max-width: 720px;
            width: 94%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        }

        .ann-banner {
            background: linear-gradient(135deg, rgba(30, 110, 240, 0.08), rgba(245, 158, 11, 0.08));
            border: 1px solid rgba(245, 158, 11, 0.15);
            border-radius: var(--radius);
            padding: 12px 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .ann-banner .ann-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .ann-banner .ann-body {
            flex: 1;
            min-width: 0;
        }
        .ann-banner .ann-title {
            font-weight: 700;
            font-size: 0.82rem;
            color: #f59e0b;
        }
        .ann-banner .ann-text {
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.5;
        }
        .ann-banner .ann-meta {
            font-size: 0.62rem;
            color: var(--muted);
            opacity: 0.5;
            margin-top: 3px;
        }
        .ann-banner .ann-dismiss {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: var(--muted);
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .ann-banner .ann-dismiss:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .item-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 700;
            background: rgba(30, 110, 240, 0.12);
            color: var(--blue);
        }
        .delivery-card {
            background: var(--card);
            border: 1px solid var(--border);

    <script>
        // ═══════════════════════════════════════════════════════════════

        // ═══════════════════════════════════════════════════════════════

        let POSTSHOP_ITEMS = [];

        const BRANCHES = [

            { id: 'W33', name: 'KASOA NYANYANO', district: 'ACCRA WEST' },
            { id: 'W34', name: 'ODUPONG', district: 'ACCRA WEST' }
        ];
        const DISTRICTS = ['ACCRA CENTRAL', 'ACCRA NORTH', 'ACCRA WEST'];

        function genMonths() {
            const MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
                'October', 'November', 'December'
            ];
            const arr = [];
            const startYear = 2026;
            const endYear = 2027;
            for (let y = startYear; y <= endYear; y++) {
                for (let m = 0; m < 12; m++) {
                    arr.push(MN[m] + ' ' + y);
                }
            }
            return arr;
        }
        const MONTHS = genMonths();

        let STATE = {
            user: { role: null, district: null, branchId: null },
            month: MONTHS[0],
            ledger: {},
            stock: {},
            deliveries: [],
            requests: [],
            announcements: [],
            notifications: [],
            itemPrices: {},
            monthlyReports: {},
            postshopItems: [],
            internalItems: [],
            internalStock: {},
            internalMovements: [],
        };

        let ITEMS = [];
        const SHARED_KEYS = ['ledger', 'stock', 'deliveries', 'requests', 'announcements',
            'notifications', 'itemPrices', 'monthlyReports', 'postshopItems', 'internalItems',
            'internalStock', 'internalMovements'
        ];

        let _charts = {};
        let _lastActiveTab = 'dashboard';
        let _pollTimer = null;
        let _saveTimer = null;
        let _lastSaveAt = 0;
        const SAVE_COOLDOWN_MS = 5000;
        let _saving = false;

        const $ = id => document.getElementById(id);
        const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const fmt = v => 'GHS ' + parseFloat(v || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        const fmtDate = iso => { try { return new Date(iso).toLocaleString('en-GH', { dateStyle: 'medium',
                    timeStyle: 'short' }); } catch { return iso || ''; } };
        const fmtDateShort = iso => { try { return new Date(iso).toLocaleDateString('en-GH', { day: '2-digit',
                    month: 'short', year: 'numeric' }); } catch { return iso || ''; } };

        function getPostshopItems() { return STATE.postshopItems || []; }

        function getInternalItems() { return STATE.internalItems || []; }

        function getPrice(itemId) {
            const item = getPostshopItems().find(i => i.id === itemId);
            if (item) return item.defaultPrice || 0;
            return STATE.itemPrices[itemId] || 0;
        }

        function getInternalStock() { if (!STATE.internalStock) STATE.internalStock = {}; return STATE.internalStock; }

        function getInternalMovements() { if (!STATE.internalMovements) STATE.internalMovements = []; return STATE
                .internalMovements; }

        function toast(msg, type = 'ok') {
            const c = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast' + (type === 'err' ? ' err' : type === 'warn' ? ' warn' : '');
            el.textContent = msg;
            c.appendChild(el);
            setTimeout(() => { el.style.opacity = '0';
                el.style.transform = 'translateX(110%) scale(0.9)';
                el.style.transition = '0.3s';
                setTimeout(() => el.remove(), 350); }, 3800);
        }

        function pushNotification(title, body, type = 'info') {
            STATE.notifications.unshift({
                id: Date.now() + Math.random().toString(16).slice(2),
                title, body, type,
                read: false,
                createdAt: new Date().toISOString(),
            });
            if (STATE.notifications.length > 200) STATE.notifications.length = 200;
        }

        function blankLedger() {
            const o = {};
            const items = getPostshopItems();
            items.forEach(i => { o[i.id + '_qty'] = 0;
                o[i.id + '_value'] = 0; });
            o.payments = 0;
            o.totalValue = 0;
            o.closingBalance = 0;
            return o;
        }

        function calcLedger(record) {
            let total = 0;
            const items = getPostshopItems();
            items.forEach(i => {
                const qty = record[i.id + '_qty'] || 0;
                const price = getPrice(i.id);
                const val = qty * price;
                record[i.id + '_value'] = val;
                total += val;
            });
            record.totalValue = total;
            record.closingBalance = (record.openingBalance || 0) + total - (record.payments || 0);
            return record;
        }

        function blankStock() {
            const o = {};
            const items = getPostshopItems();
            items.forEach(i => {
                o[i.id + '_opening'] = 0;
                o[i.id + '_received'] = 0;
                o[i.id + '_distributed'] = 0;
                o[i.id + '_closing'] = 0;
            });
            o.movements = [];
            return o;
        }

        function blankInternalStock() {
            const o = {};
            const items = getInternalItems();
            items.forEach(i => {
                o[i.id + '_opening'] = 0;
                o[i.id + '_received'] = 0;
                o[i.id + '_distributed'] = 0;
                o[i.id + '_closing'] = 0;
            });
            o.movements = [];
            return o;
        }

        function ensureStockStructure() {
            MONTHS.forEach(m => {
                if (!STATE.stock[m]) {
                    STATE.stock[m] = blankStock();
                }
                const items = getPostshopItems();
                items.forEach(i => {
                    if (STATE.stock[m][i.id + '_opening'] === undefined) STATE.stock[m][i.id + '_opening'] = 0;
                    if (STATE.stock[m][i.id + '_received'] === undefined) STATE.stock[m][i.id + '_received'] = 0;
                    if (STATE.stock[m][i.id + '_distributed'] === undefined) STATE.stock[m][i.id + '_distributed'] = 0;
                    if (STATE.stock[m][i.id + '_closing'] === undefined) STATE.stock[m][i.id + '_closing'] = 0;
                });
                if (!STATE.stock[m].movements) STATE.stock[m].movements = [];
            });

            MONTHS.forEach(m => {
                if (!STATE.internalStock[m]) {
                    STATE.internalStock[m] = blankInternalStock();
                }
                const items = getInternalItems();
                items.forEach(i => {
                    if (STATE.internalStock[m][i.id + '_opening'] === undefined) STATE.internalStock[m][i.id + '_opening'] = 0;
                    if (STATE.internalStock[m][i.id + '_received'] === undefined) STATE.internalStock[m][i.id + '_received'] = 0;
                    if (STATE.internalStock[m][i.id + '_distributed'] === undefined) STATE.internalStock[m][i.id + '_distributed'] = 0;
                    if (STATE.internalStock[m][i.id + '_closing'] === undefined) STATE.internalStock[m][i.id + '_closing'] = 0;
                });
                if (!STATE.internalStock[m].movements) STATE.internalStock[m].movements = [];
            });
        }

        function visibleBranches() {
            const u = STATE.user;
            if (u.role === 'Procurement Manager' || u.role === 'Audit' || u.role === 'Regional Head' || u.role ===
                'Accountant')
                return BRANCHES;
            if (u.role === 'District Head') return BRANCHES.filter(b => b.district === u.district);
            if (u.role === 'Post Master') return BRANCHES.filter(b => b.id === u.branchId);
            return BRANCHES;
        }

        function distTotals(branches, month) {
            let op = 0,
                sv = 0,
                py = 0,
                cb = 0,
                qty = 0;
            const items = getPostshopItems();
            branches.forEach(b => {
                const r = STATE.ledger[month]?.[b.id] || blankLedger();
                op += r.openingBalance || 0;
                sv += r.totalValue || 0;
                py += r.payments || 0;
                cb += r.closingBalance || 0;
                items.forEach(i => { qty += r[i.id + '_qty'] || 0; });
            });
            return { op, sv, py, cb, qty };
        }

        function recalcAll() {
            const items = getPostshopItems();
            MONTHS.forEach(m => {
                if (!STATE.ledger[m]) STATE.ledger[m] = {};
                BRANCHES.forEach(b => {
                    if (!STATE.ledger[m][b.id]) STATE.ledger[m][b.id] = blankLedger();
                    calcLedger(STATE.ledger[m][b.id]);
                });
            });

            for (let i = 1; i < MONTHS.length; i++) {
                const prev = MONTHS[i - 1],
                    cur = MONTHS[i];
                BRANCHES.forEach(b => {
                    const prevR = STATE.ledger[prev]?.[b.id] || blankLedger();
                    const curR = STATE.ledger[cur]?.[b.id] || blankLedger();
                    if (curR.openingBalance === undefined || curR.openingBalance === 0) {
                        curR.openingBalance = prevR.closingBalance || 0;
                    }
                    calcLedger(curR);
                });
            }

            ensureStockStructure();

            for (let i = 1; i < MONTHS.length; i++) {
                const prev = MONTHS[i - 1],
                    cur = MONTHS[i];
                const prevStock = STATE.stock[prev] || blankStock();
                const curStock = STATE.stock[cur] || blankStock();
                items.forEach(item => {
                    const prevClosing = prevStock[item.id + '_closing'] || 0;
                    if (curStock[item.id + '_opening'] === undefined || curStock[item.id + '_opening'] === 0) {
                        curStock[item.id + '_opening'] = prevClosing;
                    }
                    const opening = curStock[item.id + '_opening'] || 0;
                    const received = curStock[item.id + '_received'] || 0;
                    const distributed = curStock[item.id + '_distributed'] || 0;
                    curStock[item.id + '_closing'] = opening + received - distributed;
                });
            }

            const intItems = getInternalItems();
            for (let i = 1; i < MONTHS.length; i++) {
                const prev = MONTHS[i - 1],
                    cur = MONTHS[i];
                const prevStock = STATE.internalStock[prev] || blankInternalStock();
                const curStock = STATE.internalStock[cur] || blankInternalStock();
                intItems.forEach(item => {
                    const prevClosing = prevStock[item.id + '_closing'] || 0;
                    if (curStock[item.id + '_opening'] === undefined || curStock[item.id + '_opening'] === 0) {
                        curStock[item.id + '_opening'] = prevClosing;
                    }
                    const opening = curStock[item.id + '_opening'] || 0;
                    const received = curStock[item.id + '_received'] || 0;
                    const distributed = curStock[item.id + '_distributed'] || 0;
                    curStock[item.id + '_closing'] = opening + received - distributed;
                });
            }
        }

        function recalcStockFromMovements() {
            const items = getPostshopItems();
            
            MONTHS.forEach(m => {
                if (STATE.stock[m]) {
                    items.forEach(i => {
                        STATE.stock[m][i.id + '_opening'] = 0;
                        STATE.stock[m][i.id + '_received'] = 0;
                        STATE.stock[m][i.id + '_distributed'] = 0;
                        STATE.stock[m][i.id + '_closing'] = 0;
                    });
                }
            });

            for (let mIdx = 0; mIdx < MONTHS.length; mIdx++) {
                const month = MONTHS[mIdx];
                const st = STATE.stock[month];
                if (!st) continue;

                if (mIdx > 0) {
                    const prevMonth = MONTHS[mIdx - 1];
                    const prevSt = STATE.stock[prevMonth];
                    if (prevSt) {
                        items.forEach(i => {
                            st[i.id + '_opening'] = prevSt[i.id + '_closing'] || 0;
                        });
                    }
                }

                const movements = st.movements || [];
                movements.forEach(mv => {
                    mv.items.forEach(it => {
                        if (mv.type === 'receipt') {
                            st[it.id + '_received'] = (st[it.id + '_received'] || 0) + it.qty;
                        } else if (mv.type === 'branch' || mv.type === 'management') {
                            st[it.id + '_distributed'] = (st[it.id + '_distributed'] || 0) + it.qty;
                        }
                    });
                });

                items.forEach(i => {
                    const opening = st[i.id + '_opening'] || 0;
                    const received = st[i.id + '_received'] || 0;
                    const distributed = st[i.id + '_distributed'] || 0;
                    st[i.id + '_closing'] = opening + received - distributed;
                });
            }
        }

        function recalcInternalStockFromMovements() {
            const items = getInternalItems();
            
            MONTHS.forEach(m => {
                if (STATE.internalStock[m]) {
                    items.forEach(i => {
                        STATE.internalStock[m][i.id + '_opening'] = 0;
                        STATE.internalStock[m][i.id + '_received'] = 0;
                        STATE.internalStock[m][i.id + '_distributed'] = 0;
                        STATE.internalStock[m][i.id + '_closing'] = 0;
                    });
                }
            });

            for (let mIdx = 0; mIdx < MONTHS.length; mIdx++) {
                const month = MONTHS[mIdx];
                const st = STATE.internalStock[month];
                if (!st) continue;

                if (mIdx > 0) {
                    const prevMonth = MONTHS[mIdx - 1];
                    const prevSt = STATE.internalStock[prevMonth];
                    if (prevSt) {
                        items.forEach(i => {
                            st[i.id + '_opening'] = prevSt[i.id + '_closing'] || 0;
                        });
                    }
                }

                const movements = st.movements || [];
                movements.forEach(mv => {
                    mv.items.forEach(it => {
                        if (mv.type === 'receipt') {
                            st[it.id + '_received'] = (st[it.id + '_received'] || 0) + it.qty;
                        } else if (mv.type === 'management') {
                            st[it.id + '_distributed'] = (st[it.id + '_distributed'] || 0) + it.qty;
                        }
                    });
                });

                items.forEach(i => {
                    const opening = st[i.id + '_opening'] || 0;
                    const received = st[i.id + '_received'] || 0;
                    const distributed = st[i.id + '_distributed'] || 0;
                    st[i.id + '_closing'] = opening + received - distributed;
                });
            }
        }

        function seedData() {
            STATE.postshopItems = [];
            STATE.internalItems = [];
            STATE.itemPrices = {};
            STATE.internalStock = {};
            STATE.internalMovements = [];
            MONTHS.forEach(m => {
                STATE.ledger[m] = {};
                BRANCHES.forEach(b => { STATE.ledger[m][b.id] = blankLedger(); });
            });
            MONTHS.forEach(m => { STATE.stock[m] = blankStock(); });
            MONTHS.forEach(m => { STATE.internalStock[m] = blankInternalStock(); });
            STATE.deliveries = [];
            STATE.requests = [];
            STATE.announcements = [];
            STATE.notifications = [];
            STATE.monthlyReports = {};
            recalcAll();
        }

        function sharedSnapshot() {
            const o = {};
            SHARED_KEYS.forEach(k => { o[k] = STATE[k]; });
            return o;
        }

        function schedulePersist() {
            if (_saveTimer) clearTimeout(_saveTimer);
            _saveTimer = setTimeout(() => persistState(false), 900);
        }

        // ─── FIXED: PERSISTENCE ──────────────────────────────────────

        async function persistState(manual) {
            if (_saving) {
                console.log('⏳ Already saving, skipping...');
                return;
            }
            _saving = true;
            const dot = $('syncDot'),
                txt = $('syncTxt');
            if (dot) dot.className = 'status-dot';
            if (txt) txt.innerText = 'Saving …';

            try {
                const data = sharedSnapshot();
                if (!data || Object.keys(data).length === 0) {
                    console.warn('No data to save');
                    return;
                }

                console.log('📤 SAVING DATA TO BACKEND:');
                console.log('  - Announcements:', data.announcements ? data.announcements.length : 0);
                console.log('  - MonthlyReports:', data.monthlyReports ? Object.keys(data.monthlyReports).length : 0);
                console.log('  - Requests:', data.requests ? data.requests.length : 0);
                console.log('  - Notifications:', data.notifications ? data.notifications.length : 0);
                console.log('  - Stock months:', data.stock ? Object.keys(data.stock).length : 0);
                console.log('  - InternalStock months:', data.internalStock ? Object.keys(data.internalStock).length : 0);

                const jsonData = JSON.stringify(data);
                const formData = new URLSearchParams();
                formData.append('action', 'saveState');
                formData.append('data', jsonData);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                const responseText = await response.text();
                console.log('📥 Save response:', responseText);

                try {
                    const result = JSON.parse(responseText);
                    if (result.status === 'ok' || result.status === 'partial') {
                        _lastSaveAt = Date.now();
                        if (dot) dot.className = 'status-dot live';
                        if (txt) txt.innerText = 'Synced ' + new Date().toLocaleTimeString('en-GH', { hour: '2-digit', minute: '2-digit' });
                        console.log('✅ Save successful');
                        if (manual) toast('✅ All data saved');
                    } else {
                        throw new Error(result.error || 'Save returned error status');
                    }
                } catch (parseErr) {
                    console.log('⚠️ Could not parse response, but save may have succeeded');
                    _lastSaveAt = Date.now();
                    if (dot) dot.className = 'status-dot live';
                    if (txt) txt.innerText = 'Synced ' + new Date().toLocaleTimeString('en-GH', { hour: '2-digit', minute: '2-digit' });
                    if (manual) toast('✅ Save sent (check Google Sheets for confirmation)');
                }

                setTimeout(() => {
                    console.log('🔄 Verifying save by loading data...');
                    pullState(true, true);
                }, 1000);

            } catch (err) {
                _saving = false;
                if (dot) dot.className = 'status-dot';
                if (txt) txt.innerText = 'Save failed';
                toast('⚠️ Could not save: ' + (err && err.message ? err.message : err), 'err');
                console.error('❌ Save error:', err);
            } finally {
                _saving = false;
            }
        }

        async function pullState(silent, force) {
            if (!force && (_saveTimer || _saving)) return;
            if (!force && (Date.now() - _lastSaveAt < SAVE_COOLDOWN_MS)) return;

            try {
                console.log('📥 LOADING DATA FROM BACKEND...');
                const response = await fetch(API_URL + '?action=loadState');
                const rawText = await response.text();

                if (!rawText || rawText.trim() === '') {
                    console.log('⚠️ Empty response from server');
                    return;
                }

                try {
                    const loaded = JSON.parse(rawText);
                    console.log('📥 LOADED DATA:');
                    console.log('  - Announcements:', loaded.announcements ? loaded.announcements.length : 0);
                    console.log('  - MonthlyReports:', loaded.monthlyReports ? Object.keys(loaded.monthlyReports).length : 0);
                    console.log('  - Requests:', loaded.requests ? loaded.requests.length : 0);
                    console.log('  - Notifications:', loaded.notifications ? loaded.notifications.length : 0);
                    console.log('  - Stock months:', loaded.stock ? Object.keys(loaded.stock).length : 0);
                    console.log('  - InternalStock months:', loaded.internalStock ? Object.keys(loaded.internalStock).length : 0);

                    let changed = false;
                    SHARED_KEYS.forEach(k => {
                        if (loaded[k] !== undefined) {
                            STATE[k] = loaded[k];
                            changed = true;
                        }
                    });

                    if (changed) {
                        ensureStockStructure();
                        recalcAll();
                        buildNav();
                        console.log('✅ State updated from server');
                        const dot = $('syncDot');
                        const txt = $('syncTxt');
                        if (dot) dot.className = 'status-dot live';
                        if (txt) txt.innerText = 'Synced ' + new Date().toLocaleTimeString('en-GH', { hour: '2-digit', minute: '2-digit' });
                    }
                } catch (e) {
                    console.log('⚠️ Could not parse server response:', e.message);
                    console.log('Raw response (first 200 chars):', rawText.substring(0, 200));
                }
            } catch (err) {
                if (!silent) toast('⚠️ Could not refresh from server', 'warn');
                console.error('❌ Load error:', err);
            }
        }

                '';

        window.addPostshopItem = function() {
            const name = $('newPostItemName')?.value.trim();
            const unit = $('newPostItemUnit')?.value.trim() || 'pc';
            const price = parseFloat($('newPostItemPrice')?.value) || 0;
            if (!name) { toast('Enter an item name', 'warn'); return; }
            if (price < 0) { toast('Price cannot be negative', 'warn'); return; }

            const existing = getPostshopItems().find(i => i.name.toLowerCase() === name.toLowerCase());
            if (existing) { toast('Item with this name already exists', 'warn'); return; }

            const id = 'ps_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            const newItem = { id, name, unit, defaultPrice: price };
            STATE.postshopItems.push(newItem);
            STATE.itemPrices[id] = price;

            MONTHS.forEach(m => {
                if (!STATE.ledger[m]) STATE.ledger[m] = {};
                BRANCHES.forEach(b => {
                    if (!STATE.ledger[m][b.id]) STATE.ledger[m][b.id] = blankLedger();
                    STATE.ledger[m][b.id][id + '_qty'] = 0;
                    STATE.ledger[m][b.id][id + '_value'] = 0;
                    calcLedger(STATE.ledger[m][b.id]);
                });
                if (!STATE.stock[m]) STATE.stock[m] = blankStock();
                STATE.stock[m][id + '_opening'] = 0;
                STATE.stock[m][id + '_received'] = 0;
                STATE.stock[m][id + '_distributed'] = 0;
                STATE.stock[m][id + '_closing'] = 0;
            });
            recalcAll();
            toast(`✅ Added PostShop item "${name}"`);
            renderManageItems();
            schedulePersist();
        };

        window.removePostshopItem = function(id) {
            if (!confirm('Delete this PostShop item and all its data? This cannot be undone.')) return;
            const item = getPostshopItems().find(i => i.id === id);
            if (!item) { toast('Item not found', 'err'); return; }

            STATE.postshopItems = STATE.postshopItems.filter(i => i.id !== id);
            delete STATE.itemPrices[id];

            MONTHS.forEach(m => {
                if (STATE.ledger[m]) {
                    BRANCHES.forEach(b => {
                        if (STATE.ledger[m][b.id]) {
                            delete STATE.ledger[m][b.id][id + '_qty'];
                            delete STATE.ledger[m][b.id][id + '_value'];
                            calcLedger(STATE.ledger[m][b.id]);
                        }
                    });
                }
                if (STATE.stock[m]) {
                    delete STATE.stock[m][id + '_opening'];
                    delete STATE.stock[m][id + '_received'];
                    delete STATE.stock[m][id + '_distributed'];
                    delete STATE.stock[m][id + '_closing'];
                }
            });
            recalcAll();
            toast(`🗑️ Removed PostShop item "${item.name}"`);
            renderManageItems();
            schedulePersist();
        };

        window.loadSupplyForm = function(bid) {

            const m = STATE.month;
            if (!STATE.ledger[m]) STATE.ledger[m] = {};
            if (!STATE.ledger[m][bid]) STATE.ledger[m][bid] = blankLedger();

                </div>
              </div>
            `;
            window.updateSupplyCalc(bid);
        };

        window.updateSupplyCalc = function(bid) {
            const items = getPostshopItems();
            const m = STATE.month;
            const r = STATE.ledger[m]?.[bid] || blankLedger();
            let total = 0;
            items.forEach(i => {
                const qty = parseInt($('sup_' + i.id)?.value) || 0;
                const price = getPrice(i.id);
                const val = qty * price;
                total += val;
                const el = $('supVal_' + i.id);
                if (el) el.innerText = 'Val: ' + fmt(val);
            });
            const svEl = $('ls_sv'),
                cbEl = $('ls_cb');
            if (svEl) svEl.innerText = fmt(total);
            const cb = (r.openingBalance || 0) + total - (r.payments || 0);
            if (cbEl) { cbEl.innerText = fmt(cb);
                cbEl.className = cb >= 0 ? 'pos' : 'neg'; }
        };

        window.saveSupply = function(bid) {
            const items = getPostshopItems();
            const m = STATE.month;
            if (!STATE.ledger[m]) STATE.ledger[m] = {};
            if (!STATE.ledger[m][bid]) STATE.ledger[m][bid] = blankLedger();
            const r = STATE.ledger[m][bid];

            const suppliedItems = items.map(i => {
                const qty = parseInt($('sup_' + i.id)?.value) || 0;
                return { id: i.id, qty };
            });

            suppliedItems.forEach(it => {
                r[it.id + '_qty'] = it.qty;
            });
            calcLedger(r);

            if (!STATE.stock[m]) STATE.stock[m] = blankStock();
            const st = STATE.stock[m];

            let insufficient = false;
            suppliedItems.forEach(it => {
                const available = st[it.id + '_closing'] || 0;
                if (it.qty > available) {
                    const name = items.find(x => x.id === it.id)?.name || it.id;
                    toast(`Insufficient stock for ${name}. Available: ${available}`, 'err');
                    insufficient = true;
                }
            });
            if (insufficient) return;

            suppliedItems.forEach(it => {
                st[it.id + '_distributed'] = (st[it.id + '_distributed'] || 0) + it.qty;
                st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                    it.id + '_distributed'] || 0);
            });

            const branch = BRANCHES.find(b => b.id === bid);
            st.movements.push({
                id: 'mv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type: 'branch',
                date: new Date().toISOString().slice(0, 10),
                recipient: branch?.name || bid,
                items: suppliedItems.filter(it => it.qty > 0),
                totalItems: suppliedItems.reduce((sum, it) => sum + it.qty, 0),
                branchId: bid,
                createdAt: new Date().toISOString()
            });

            recalcAll();
            toast('✅ PostShop supplies saved');
            schedulePersist();
            // Wait for save to complete before refreshing
            setTimeout(() => renderSupplyManagement(), 300);
        };

        window.savePayment = function(bid) {
            const m = STATE.month;
            if (!STATE.ledger[m]) STATE.ledger[m] = {};
            if (!STATE.ledger[m][bid]) STATE.ledger[m][bid] = blankLedger();
            STATE.ledger[m][bid].payments = parseFloat($('payAmount')?.value) || 0;
            calcLedger(STATE.ledger[m][bid]);
            recalcAll();
            toast('✅ Payment saved');
            schedulePersist();
            setTimeout(() => renderSupplyManagement(), 300);
        };

        window.resetSupply = function(bid) {
            if (!confirm('Reset all quantities to zero?')) return;
            const items = getPostshopItems();
            const m = STATE.month;
            if (!STATE.ledger[m]) STATE.ledger[m] = {};
            if (!STATE.ledger[m][bid]) STATE.ledger[m][bid] = blankLedger();
            const r = STATE.ledger[m][bid];
            items.forEach(i => { r[i.id + '_qty'] = 0; });
            calcLedger(r);
            recalcAll();

        window.generateReport = function() {
            const m = document.getElementById('reportMonth')?.value || STATE.month;
            if (!m) { toast('Select a month', 'warn'); return; }
            const vis = visibleBranches();
            const summary = distTotals(vis, m);
            const items = getPostshopItems();
            const branchDetails = vis.map(b => {
                const r = STATE.ledger[m]?.[b.id] || blankLedger();
                const itemDetails = items.map(i => ({
                    id: i.id,
                    name: i.name,
                    qty: r[i.id + '_qty'] || 0,
                    value: r[i.id + '_value'] || 0,
                }));
                return {
                    branchId: b.id,
                    branchName: b.name,
                    district: b.district,
                    opening: r.openingBalance || 0,
                    totalValue: r.totalValue || 0,
                    payments: r.payments || 0,
                    closing: r.closingBalance || 0,
                    items: itemDetails,
                };
            });
            STATE.monthlyReports[m] = {
                generatedAt: new Date().toISOString(),
                summary: summary,
                branchDetails: branchDetails,
            };
            toast(`✅ Report generated for ${m}`);
            schedulePersist();
            setTimeout(() => renderMonthlyReports(), 300);
        };

        window.fulfillRequest = function(requestId) {
            const req = STATE.requests.find(r => r.id == requestId);
            if (!req || req.status !== 'pending') { toast('Request not found', 'err'); return; }

            const items = getPostshopItems();
            const m = req.month;
            const bid = req.branchId;
            
            if (!STATE.stock[m]) STATE.stock[m] = blankStock();
            const st = STATE.stock[m];
            const requestedItems = Object.entries(req.items || {}).filter(([k, v]) => v > 0).map(([k, v]) => {
                const itemId = k.replace('_qty', '');
                return { id: itemId, qty: v };
            });

            let insufficient = false;
            requestedItems.forEach(it => {
                const available = st[it.id + '_closing'] || 0;
                if (it.qty > available) {
                    const name = items.find(x => x.id === it.id)?.name || it.id;
                    toast(`Insufficient central stock for ${name}. Available: ${available}`, 'err');
                    insufficient = true;
                }
            });
            if (insufficient) return;

            req.status = 'fulfilled';
            req.fulfilledAt = new Date().toISOString();
            req.supplyNoteId = 'SN-' + req.id + '-' + Date.now();

            if (!STATE.ledger[m]) STATE.ledger[m] = {};
            if (!STATE.ledger[m][bid]) STATE.ledger[m][bid] = blankLedger();
            const r = STATE.ledger[m][bid];
            Object.entries(req.items || {}).forEach(([key, qty]) => {
                const itemId = key.replace('_qty', '');
                r[itemId + '_qty'] = (r[itemId + '_qty'] || 0) + qty;
            });
            calcLedger(r);
            recalcAll();

            requestedItems.forEach(it => {
                st[it.id + '_distributed'] = (st[it.id + '_distributed'] || 0) + it.qty;
                st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                    it.id + '_distributed'] || 0);
            });
            st.movements.push({
                id: 'mv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type: 'branch',
                date: new Date().toISOString().slice(0, 10),
                recipient: req.branchName,
                items: requestedItems,
                totalItems: requestedItems.reduce((sum, it) => sum + it.qty, 0),
                branchId: bid,
                createdAt: new Date().toISOString()
            });

            pushNotification(`Request fulfilled — ${req.branchName}`,
                `Your supply request for ${req.month} has been fulfilled.`, 'fulfilled');
            toast(`✅ Request #${requestId} fulfilled`);
            schedulePersist();
            setTimeout(() => renderRequests(), 300);
        };

                      <td>${r.status==='fulfilled'?`<button class="btn btn-primary btn-xs" onclick="showSupplyNote(${r.id})">📄 Note</button>`:`<button class="btn btn-danger btn-xs" onclick="cancelMyRequest(${r.id})">🗑️ Cancel</button>`}</td>
                    </tr>
                  `).join('') : `<tr><td colspan="4" style="color:var(--muted)">No requests submitted yet.</td></tr>`}
                </tbody>
              </table></div>

          `;
            $('mainContent').innerHTML = html;
            window.updateMyRequestTotal = function() {
                const items = getPostshopItems();

                items.forEach(i => { total += parseInt($('req_' + i.id)?.value) || 0; });
                const el = $('myReqTotalItems');
                if (el) el.innerText = 'Total Items: ' + total;
            };

        window.submitSupplyRequest = function() {
            const items = getPostshopItems();
            const bid = STATE.user.branchId;
            const branch = BRANCHES.find(b => b.id === bid);
            if (!branch) { toast('Branch not found', 'err'); return; }
            if (STATE.requests.some(r => r.branchId === bid && r.status === 'pending')) {
                toast('You already have a pending request', 'warn');
                return;
            }
            const requested = {};
            let total = 0;
            items.forEach(i => {
                const qty = parseInt($('req_' + i.id)?.value) || 0;
                if (qty > 0) { requested[i.id + '_qty'] = qty;
                    total += qty; }
            });
            if (!total) { toast('Enter at least one quantity', 'warn'); return; }
            const note = $('myReqNote')?.value.trim() || '';

            const request = {
                id: Date.now(),
                branchId: bid,
                branchName: branch.name,
                district: branch.district,
                month: STATE.month,
                items: requested,
                note,
                status: 'pending',
                createdAt: new Date().toISOString(),
            };
            STATE.requests.push(request);
            pushNotification(`New supply request — ${branch.name}`,
                `${branch.name} requested ${total} item${total===1?'':'s'} for ${STATE.month}.`, 'request');
            toast('📮 Request submitted to Procurement Manager');
            schedulePersist();
            setTimeout(() => renderMyRequests(), 300);
        };

        window.cancelMyRequest = function(requestId) {
            if (!confirm('Cancel this request?')) return;
            const req = STATE.requests.find(r => r.id == requestId);
            if (!req || req.status !== 'pending') { toast('Cannot cancel this request', 'err'); return; }
            STATE.requests = STATE.requests.filter(r => r.id != requestId);
            toast('🗑️ Request cancelled');
            schedulePersist();
            setTimeout(() => renderMyRequests(), 300);

            let from = MONTHS[Math.max(0, safe - 5)],
                to = MONTHS[safe];

            </div>

              <div class="chart-box"><div class="chart-title">🏅 Top Branches · Closing</div><canvas id="ch3" height="220"></canvas></div>
              <div class="chart-box"><div class="chart-title">📦 Item Distribution</div><canvas id="ch4" height="220"></canvas></div>
            </div>

        function buildAnalyticsCharts(from, to) {
            if (typeof Chart === 'undefined') {
                document.querySelectorAll('.chart-box').forEach(el => el.innerHTML =
                    '<div style="padding:20px;color:var(--red);text-align:center">⚠️ Chart.js not loaded</div>');
                return;
            }
            const vis = visibleBranches();
            const fromIdx = MONTHS.indexOf(from);
            const toIdx = MONTHS.indexOf(to);
            const range = MONTHS.slice(fromIdx >= 0 ? fromIdx : 0, toIdx >= 0 ? toIdx + 1 : MONTHS.length);
            const data = range.map(m => {
                const t = distTotals(vis, m);
                return { m, sv: t.sv, py: t.py, cb: t.cb, qty: t.qty };
            });
            const labels = range.map(m => m.replace(' 2026', ''));

            const c1 = $('ch1');
            if (c1) _charts.c1 = new Chart(c1, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: 'Supply Value', data: data.map(d => d.sv), backgroundColor: 'rgba(30,110,240,0.7)',
                            borderRadius: 4 },
                        { label: 'Payments', data: data.map(d => d.py), backgroundColor: 'rgba(245,158,11,0.7)',
                            borderRadius: 4 }
                    ]
                },
                options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: { y: { ticks: { color: '#94a3b8', callback: v => 'GHS ' + v.toLocaleString() } },
                        x: { ticks: { color: '#94a3b8' } } } }
            });

            const c2 = $('ch2');
            if (c2) _charts.c2 = new Chart(c2, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Net Closing Balance',
                        data: data.map(d => d.cb),
                        borderColor: '#22d3ee',
                        backgroundColor: 'rgba(34,211,238,0.08)',
                        fill: true,
                        tension: 0.35,
                        pointRadius: 4
                    }]
                },
                options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: { y: { ticks: { color: '#94a3b8', callback: v => 'GHS ' + v.toLocaleString() } },
                        x: { ticks: { color: '#94a3b8' } } } }
            });

            const focus = STATE.month;
            const ranked = [...vis].map(b => {
                const r = STATE.ledger[focus]?.[b.id] || blankLedger();
                return { name: b.name, cb: r.closingBalance };
            }).sort((a, b) => b.cb - a.cb).slice(0, 10);
            const c3 = $('ch3');
            if (c3) _charts.c3 = new Chart(c3, {
                type: 'bar',
                data: {
                    labels: ranked.map(b => b.name.length > 14 ? b.name.slice(0, 14) + '…' : b.name),
                    datasets: [{
                        label: 'Closing Balance',
                        data: ranked.map(b => b.cb),
                        backgroundColor: ranked.map(b => b.cb >= 0 ? 'rgba(52,211,153,0.7)' :
                            'rgba(248,113,113,0.7)'),
                        borderRadius: 4
                    }]
                },
                options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } },
                    scales: { x: { ticks: { color: '#94a3b8', callback: v => 'GHS ' + v.toLocaleString() } },
                        y: { ticks: { color: '#94a3b8' } } } }
            });

            const items = getPostshopItems();
            const itemQtyList = items.map(i => {
                let q = 0;
                range.forEach(m => {
                    vis.forEach(b => {
                        const r = STATE.ledger[m]?.[b.id] || blankLedger();
                        q += r[i.id + '_qty'] || 0;
                    });
                });
                return { name: i.name, qty: q };
            }).filter(x => x.qty > 0).sort((a, b) => b.qty - a.qty);

            const TOP_N = 12;
            const top = itemQtyList.slice(0, TOP_N);
            const otherTotal = itemQtyList.slice(TOP_N).reduce((s, x) => s + x.qty, 0);
            const chartRows = otherTotal > 0 ? [...top, { name: `Other (${itemQtyList.length-TOP_N} items)`, qty:
                otherTotal
            }] : top;
            const palette = chartRows.map((_, idx) => `hsl(${Math.round(idx*360/Math.max(chartRows.length,1))},70%,60%)`);

            const c4 = $('ch4');
            if (!chartRows.length) {
                if (c4) c4.replaceWith(Object.assign(document.createElement('div'), { style:
                    'padding:30px;text-align:center;color:var(--muted)', innerText: 'No item activity in this range.'
                }));
            } else if (c4) {
                _charts.c4 = new Chart(c4, {
                    type: 'doughnut',
                    data: {
                        labels: chartRows.map(x => x.name),
                        datasets: [{ data: chartRows.map(x => x.qty), backgroundColor: palette, borderWidth: 2 }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'right', labels: { color: '#94a3b8',
                                    boxWidth: 12, font: { size: 10 } } } } }
                });
            }

            const tbl = $('anaTable');
            if (tbl) {
                let th = `<div style="font-weight:700;font-size:0.82rem;margin-bottom:10px">📋 Monthly Summary</div>
              <table style="min-width:600px"><thead><tr><th class="tl">Month</th><th>Supply</th><th>Payments</th><th>Collection %</th><th>Closing</th><th>Items</th></tr></thead><tbody>`;
                range.forEach(m => {
                    const d = data.find(x => x.m === m) || { sv: 0, py: 0, cb: 0, qty: 0 };
                    const pct = d.sv > 0 ? (d.py / d.sv * 100).toFixed(1) : '0.0';
                    th +=
                        `<tr><td class="tl">${m}</td><td>${fmt(d.sv)}</td><td>${fmt(d.py)}</td><td style="color:${parseFloat(pct)>=80?'var(--green)':parseFloat(pct)>=50?'var(--orange)':'var(--red)'};font-weight:700">${pct}%</td><td class="${d.cb>=0?'pos':'neg'}">${fmt(d.cb)}</td><td>${d.qty}</td>`;
                });
                const totS = data.reduce((a, d) => a + d.sv, 0),
                    totP = data.reduce((a, d) => a + d.py, 0);
                const totC = data.reduce((a, d) => a + d.cb, 0),
                    totQ = data.reduce((a, d) => a + d.qty, 0);
                const tp = totS > 0 ? (totP / totS * 100).toFixed(1) : '0.0';
                th +=
                    `<tr class="gtot-row"><td class="tl">TOTAL (${range.length} months)</td><td>${fmt(totS)}</td><td>${fmt(totP)}</td><td>${tp}%</td><td class="${totC>=0?'pos':'neg'}">${fmt(totC)}</td><td>${totQ}</td></tr></tbody></table>`;
                tbl.innerHTML = th;
            }
        }

                    total += qty;
                });
                const el = $('internalTotalItems');
                if (el) el.innerText = 'Total Items: ' + total;
            };

        window.submitInternalIssue = function() {
            const items = getInternalItems();
            const m = STATE.month;
            const invoice = $('internalInvoice')?.value.trim();
            const recipient = $('internalRecipient')?.value.trim();
            const dateStr = $('internalDate')?.value;
            if (!invoice) { toast('Enter invoice number', 'warn'); return; }
            if (!recipient) { toast('Enter recipient / department', 'warn'); return; }
            if (!dateStr) { toast('Select a date', 'warn'); return; }

            const issuedItems = items.map(i => {
                const qty = parseInt($('int_' + i.id)?.value) || 0;
                return { id: i.id, qty };
            });
            if (issuedItems.every(it => it.qty === 0)) { toast('Enter at least one quantity', 'warn'); return; }

            if (!STATE.internalStock[m]) STATE.internalStock[m] = blankInternalStock();
            const st = STATE.internalStock[m];
            let insufficient = false;
            issuedItems.forEach(it => {
                const available = st[it.id + '_closing'] || 0;
                if (it.qty > available) {
                    const name = items.find(x => x.id === it.id)?.name || it.id;
                    toast(`Insufficient stock for ${name}. Available: ${available}`, 'err');
                    insufficient = true;
                }
            });
            if (insufficient) return;

            let totalItems = 0;
            issuedItems.forEach(it => {
                st[it.id + '_distributed'] = (st[it.id + '_distributed'] || 0) + it.qty;
                st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                    it.id + '_distributed'] || 0);
                totalItems += it.qty;
            });

            if (!st.movements) st.movements = [];
            st.movements.push({
                id: 'imv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type: 'management',
                invoice: invoice,
                date: dateStr,
                recipient: recipient,
                items: issuedItems.filter(it => it.qty > 0),
                totalItems: totalItems,
                createdAt: new Date().toISOString()
            });

            toast(`✅ Internal issue recorded (${totalItems} items to ${recipient}, Invoice: ${invoice})`);
            schedulePersist();
            setTimeout(() => renderInternalIssues(), 300);
        };

        window.deleteInternalIssue = function(month, idx) {
            if (!confirm('Delete this internal issue record? This will REVERSE the stock quantities.')) return;
            const st = STATE.internalStock[month];
            if (!st || !st.movements || !st.movements[idx]) { toast('Record not found', 'err'); return; }
            
            const mv = st.movements[idx];
            mv.items.forEach(it => {
                st[it.id + '_distributed'] = Math.max(0, (st[it.id + '_distributed'] || 0) - it.qty);
                st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                    it.id + '_distributed'] || 0);
            });
            
            st.movements.splice(idx, 1);
            toast('🗑️ Internal issue record deleted and stock reversed');
            schedulePersist();
            setTimeout(() => renderInternalIssues(), 300);
        };

                <div id="recTotalVal" style="background:rgba(30,110,240,0.06);padding:6px 12px;border-radius:8px;margin:8px 0;text-align:right;font-weight:700">Total Value: GHS 0.00</div>

            const items = getPostshopItems();
            const m = STATE.month;
            const waybill = $('recWaybill')?.value.trim();
            const dateStr = $('recDate')?.value;
            if (!waybill || !dateStr) { toast('Fill waybill and date', 'warn'); return; }
            const receivedItems = items.map(i => {
                const qty = parseInt($('rec_' + i.id)?.value) || 0;
                return { id: i.id, qty };
            });
            if (receivedItems.every(it => it.qty === 0)) { toast('Enter at least one quantity', 'warn'); return; }
            
            if (!STATE.stock[m]) STATE.stock[m] = blankStock();
            const st = STATE.stock[m];
            let totalItems = 0;
            receivedItems.forEach(it => {
                st[it.id + '_received'] = (st[it.id + '_received'] || 0) + it.qty;
                st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                    it.id + '_distributed'] || 0);
                totalItems += it.qty;
            });
            st.movements.push({
                id: 'psmv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type: 'receipt',
                waybill: waybill,
                date: dateStr,
                items: receivedItems.filter(it => it.qty > 0),
                totalItems: totalItems,
                recipient: 'GPO Receipt',
                createdAt: new Date().toISOString()
            });
            toast(`✅ PostShop receipt recorded (${totalItems} items)`);
            $('stockReceiptForm').style.display = 'none';

            $('recWaybill').value = '';
            schedulePersist();
            setTimeout(() => renderStockManagement(), 300);
        };

        window.deletePostShopMovement = function(month, idx) {
            if (!confirm('Delete this movement record? This will REVERSE the stock quantities.')) return;
            const st = STATE.stock[month];
            if (!st || !st.movements || !st.movements[idx]) { toast('Record not found', 'err'); return; }
            
            const mv = st.movements[idx];
            if (mv.type === 'receipt') {
                mv.items.forEach(it => {
                    st[it.id + '_received'] = Math.max(0, (st[it.id + '_received'] || 0) - it.qty);
                    st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                        it.id + '_distributed'] || 0);
                });
            } else if (mv.type === 'branch') {
                mv.items.forEach(it => {
                    st[it.id + '_distributed'] = Math.max(0, (st[it.id + '_distributed'] || 0) - it.qty);
                    st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                        it.id + '_distributed'] || 0);
                });
            } else {
                mv.items.forEach(it => {
                    st[it.id + '_received'] = Math.max(0, (st[it.id + '_received'] || 0) - it.qty);
                    st[it.id + '_distributed'] = Math.max(0, (st[it.id + '_distributed'] || 0) - it.qty);
                    st[it.id + '_closing'] = (st[it.id + '_opening'] || 0) + (st[it.id + '_received'] || 0) - (st[
                        it.id + '_distributed'] || 0);
                });
            }
            
            st.movements.splice(idx, 1);
            recalcStockFromMovements();
            
            toast('🗑️ Movement deleted and stock reversed');
            schedulePersist();
            setTimeout(() => renderStockManagement(), 300);
        };
